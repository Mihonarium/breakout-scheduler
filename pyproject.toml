[project]
name = "breakout-scheduler"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "ortools>=9.9",
  "itsdangerous>=2.1",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "pywebpush>=1.14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
